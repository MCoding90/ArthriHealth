name: CI/CD

on:
  pull_request:
  push:
    branches: [master]

# One run per branch. PR runs are replaced by newer pushes; a production deploy is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test -- --watchAll=false

      # Without these the bundle builds fine but shows a blank page (Firebase has no API key).
      - name: Check Firebase config is set
        if: github.event_name == 'push' && vars.REACT_APP_FIREBASE_API_KEY == ''
        run: |
          echo "::error::Set the REACT_APP_FIREBASE_* repository variables (see README → CI/CD)"
          exit 1

      - run: npm run build
        env:
          # Public web config, baked into the bundle; access is enforced by firestore.rules / storage.rules.
          REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          # Created earlier by `firebase init hosting:github`
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYAPP_8439E }}

      # Rules ship with the app so production security always matches master.
      - name: Deploy to Firebase
        if: github.event_name == 'push'
        run: npx --yes firebase-tools@15.34.2 deploy --only hosting,firestore:rules,storage --non-interactive
