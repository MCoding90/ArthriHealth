# Headers live at server level: an add_header inside a location would drop all of these.
map $uri $cache_control {
	~^/static/ "public, max-age=31536000, immutable";
	default    "no-cache";
}

server {
	listen 80;
	root /usr/share/nginx/html;
	index index.html;

	# Keep in sync with firebase.json hosting headers
	add_header Cache-Control $cache_control; # no "always": a 404 must not be cached for a year
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location /static/ {
		try_files $uri =404;
	}

	# SPA fallback for client-side routes
	location / {
		try_files $uri /index.html;
	}
}
